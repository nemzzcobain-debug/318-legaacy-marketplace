name: Appliquer la migration Next.js 15

on:
  push:
    branches:
      - preview/next-15-5-21

permissions:
  contents: write

jobs:
  apply-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Appliquer le correctif de compatibilite Next.js 15
        shell: bash
        run: |
          cat > /tmp/next15-route-params.patch.b64 <<'PATCH_B64'

PATCH_B64
          base64 --decode /tmp/next15-route-params.patch.b64 > /tmp/next15-route-params.patch
          git apply --check /tmp/next15-route-params.patch
          git apply /tmp/next15-route-params.patch
          rm -f .github/workflows/apply-next15-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/apply-next15-migration.yml
          git commit -m "fix: adapte les routes dynamiques a Next.js 15"
          git push
