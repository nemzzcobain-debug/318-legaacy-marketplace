name: Publication SEO mobile et surveillance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-seo-mobile.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Appliquer les améliorations sur une branche
        env:
          PATCH_GZ_BASE64: |
            
        run: |
          set -e
          git config user.name "G318 Automation"
          git config user.email "nemzzcobain@gmail.com"
          printf '%s' "$PATCH_GZ_BASE64" | base64 --decode | gunzip > /tmp/marketplace.patch
          git checkout -b feat/seo-mobile-monitoring
          git apply --index /tmp/marketplace.patch
          git commit -m "[feat] améliore SEO mobile licences et surveillance"
          git push origin feat/seo-mobile-monitoring

      - name: Supprimer ce workflow temporaire
        run: |
          set -e
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/bootstrap-seo-mobile.yml
          git commit -m "[chore] supprime le workflow temporaire SEO"
          git push origin main
