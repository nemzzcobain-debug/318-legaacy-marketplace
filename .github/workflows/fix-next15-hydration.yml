name: Corriger l hydratation Next.js 15

on:
  push:
    branches:
      - preview/next-15-5-21

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transmettre les parametres serveur aux composants client
        run: |
          cat > /tmp/replacements.b64 <<'REPLACEMENTS_B64'
          
          REPLACEMENTS_B64
          base64 --decode /tmp/replacements.b64 > /tmp/replacements.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          replacements = json.loads(Path('/tmp/replacements.json').read_text())
          for filename, operations in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in operations:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: remplacement attendu 1 fois, trouve {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm -f .github/workflows/fix-next15-hydration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app .github/workflows/fix-next15-hydration.yml
          git commit -m "fix: stabilise les pages client sous Next.js 15"
          git push
