name: Publication contrats de licence PDF

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-license-contracts.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurer Git
        run: |
          git config user.name "nemzzcobain-debug"
          git config user.email "nemzzcobain@gmail.com"
      - name: Créer la branche et appliquer la modification
        env:
          PATCH_GZIP_BASE64: ""
        run: |
          echo "$PATCH_GZIP_BASE64" | base64 -d | gzip -d > /tmp/license-contracts.patch
          git checkout -b feat/license-contracts
          git am /tmp/license-contracts.patch
          git push origin feat/license-contracts
      - name: Supprimer ce workflow temporaire
        run: |
          git checkout main
          git rm .github/workflows/bootstrap-license-contracts.yml
          git commit -m "[chore] supprime le workflow temporaire des contrats"
          git push origin main
