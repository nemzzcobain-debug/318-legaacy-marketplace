name: Installation temporaire des tests et de la CI

on:
  push:
    branches:
      - chore/tests-ci
    paths:
      - .github/workflows/bootstrap-tests-ci.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/tests-ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer la configuration
        shell: bash
        run: |
          echo '' | base64 -d > package.json
          echo '' | base64 -d > vitest.config.ts
          echo '' | base64 -d > src/__tests__/setup.ts
          mkdir -p .github/workflows
          echo '' | base64 -d > .github/workflows/ci.yml
          echo '' | base64 -d > TESTS.md

      - name: Régénérer le lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-tests-ci.yml
          git add package.json package-lock.json vitest.config.ts src/__tests__/setup.ts .github/workflows/ci.yml TESTS.md
          git commit -m "[test] configure Vitest et la CI"
          git push origin chore/tests-ci
